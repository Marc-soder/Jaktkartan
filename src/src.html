<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Jaktkartan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>/*LEAFLET_CSS*/</style>
<style>
/* Layout: helskärmskarta, panel till vänster på dator och som dragbar bottenlåda på mobil. */
:root{
  --bg:#e9eee7; --surface:#fbfcfa; --surface-2:#eef2ec; --line:#d3dccf; --fg:#16231c; --muted:#5a6a61;
  --accent:#d9520e; --accent-fg:#ffffff; --accent-soft:#fbe3d5; --spruce:#1f3a2e; --danger:#b42318; --ok:#2f7d4f;
  --scrim:rgba(12,22,17,.45); --shadow:0 8px 28px rgba(18,32,25,.22);
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --panel-w:380px; --sheet-h:120px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#15201a; --surface-2:#1c2a22; --line:#2b3b32; --fg:#e3ebe5; --muted:#98aa9e;
  --accent:#ff7b35; --accent-fg:#1b0c03; --accent-soft:#3b2417; --spruce:#cfe4d6; --danger:#ff6b5e; --ok:#6fcf97;
  --scrim:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#15201a; --surface-2:#1c2a22; --line:#2b3b32; --fg:#e3ebe5; --muted:#98aa9e;
  --accent:#ff7b35; --accent-fg:#1b0c03; --accent-soft:#3b2417; --spruce:#cfe4d6; --danger:#ff6b5e; --ok:#6fcf97;
  --scrim:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--accent)}

#map{position:fixed;inset:0;background:var(--surface-2);z-index:1}
@media (min-width:860px){#map{left:var(--panel-w)}}

/* Leaflet i temat */
.leaflet-container{font-family:var(--font-body);background:var(--surface-2)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{margin:12px 14px 12px;font:14px/1.4 var(--font-body);min-width:200px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted);top:4px;right:4px}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.pin-icon{background:none;border:0}
.pin-icon svg{display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.me-dot{background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(26,115,232,.35)}

/* Kontroller på kartan */
.ctrls{position:fixed;z-index:900;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.ctrl{width:44px;height:44px;border-radius:12px;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center;padding:0}
.ctrl svg{width:22px;height:22px}
.ctrl[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ctrl-gap{height:4px}
.mode-chip{position:fixed;z-index:900;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));background:var(--accent);color:var(--accent-fg);font:700 13px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.2);border:0;display:flex;gap:6px;align-items:center}
@media (min-width:860px){.mode-chip{left:calc(var(--panel-w) + 12px)}}
.fab{position:fixed;z-index:950;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(var(--sheet-h) + 14px);width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;place-items:center;transition:bottom .25s ease}
.fab svg{width:28px;height:28px}
@media (min-width:860px){.fab{bottom:28px}}

.layer-pop{position:fixed;z-index:1200;top:calc(64px + env(safe-area-inset-top,0px));right:calc(64px + env(safe-area-inset-right,0px));width:min(290px,calc(100vw - 88px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px}
.layer-pop h3{margin:4px 6px 8px}
.base-opt{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.base-opt:hover{background:var(--surface-2)}
.base-opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.base-opt small{display:block;color:var(--muted);font-size:12px}
.pop-sep{height:1px;background:var(--line);margin:8px 4px}

/* Placering */
.crosshair{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:800;pointer-events:none;color:var(--accent)}
.crosshair svg{width:100%;height:100%;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #fff)}
.placebar{position:fixed;z-index:1100;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h) + 14px);width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:grid;gap:10px}
@media (min-width:860px){.placebar{left:calc(var(--panel-w) + (100vw - var(--panel-w))/2);bottom:28px}}
.placebar p{margin:0;font-size:14px;color:var(--muted)}
.placebar .coords{font:500 13px/1.3 var(--font-mono);color:var(--fg)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow > *{flex:1 1 auto}

/* Panel / bottenlåda */
#panel{position:fixed;z-index:1000;left:0;right:0;bottom:0;height:var(--sheet-h);background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
#panel.dragging{transition:none}
#panel.peek:not(.dragging) .p-body{visibility:hidden}
.handle{flex:none;height:22px;display:grid;place-items:center;touch-action:none;cursor:grab;border:0;background:none;width:100%;padding:0}
.handle span{width:42px;height:5px;border-radius:3px;background:var(--line)}
.p-head{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));touch-action:none}
.brand{font:700 22px/1.1 var(--font-display);letter-spacing:.02em;margin:0;color:var(--spruce)}
.brand b{color:var(--accent)}
.p-stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{flex:none;display:flex;gap:2px;padding:6px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:10px 2px 9px;font:600 14px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.p-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:860px){
  #panel{top:0;right:auto;width:var(--panel-w);height:auto;border-radius:0;box-shadow:none;border-right:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .handle{display:none}
  .p-head{padding-top:16px}
}

/* Gemensamma element */
h3.sec{font:700 14px/1.2 var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h3.sec:first-child{margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px;border-radius:9px}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 2px;letter-spacing:0;text-transform:none;font-family:var(--font-body)}
.field{display:grid;gap:5px;margin-bottom:12px}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
textarea.input{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}

/* Brytare */
.sw-toggle{position:relative;width:44px;height:26px;flex:none;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;margin:0;cursor:pointer;transition:background .15s}
.sw-toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw-toggle:checked{background:var(--accent)}
.sw-toggle:checked::after{transform:translateX(18px)}
.sw-toggle:disabled{opacity:.45;cursor:default}

/* Symbol-bricka */
.swatch{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.swatch svg{width:17px;height:17px}
.swatch.sm{width:22px;height:22px}.swatch.sm svg{width:13px;height:13px}
.swatch .txt{font:700 11px/1 var(--font-body)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}

/* Nållista */
.listbar{display:flex;gap:8px;margin-bottom:10px}
.listbar .input{min-height:40px;padding:8px 10px}
.listbar select.input{width:auto;flex:none}
.group{margin-bottom:6px}
.group-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 0 6px;text-align:left}
.group-h .gname{font:700 15px/1.1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0}
.group-h .gcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.group-h .chev{width:16px;height:16px;color:var(--muted);transition:transform .15s}
.group.closed .chev{transform:rotate(-90deg)}
.group.closed .rows{display:none}
.rows{display:grid;gap:2px}
.pin-row{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 8px;border-radius:10px;background:var(--surface-2)}
.pin-row .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 0;display:flex;align-items:center;gap:10px}
.pin-row .txt{min-width:0}
.pin-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-row .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.navbtn{flex:none;display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-weight:600;font-size:14px;color:var(--accent-fg);background:var(--accent);border-radius:9px;padding:8px 10px;min-height:38px}
.navbtn svg{width:16px;height:16px}
.empty{padding:18px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:14px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}

/* Filterlistor */
.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .fname{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font:600 11px/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:4px 6px;border-radius:6px;background:var(--accent-soft);color:var(--fg)}
.iconbtn{border:0;background:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn.armed{background:var(--danger);color:#fff}
.iconbtn svg{width:18px;height:18px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .input{min-height:40px;padding:8px 10px}

/* Jakt och vilt */
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.card.dim{opacity:.65}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.card-h strong{font:700 18px/1.15 var(--font-display);letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.tag.on{background:var(--ok);color:#fff}
.lbl{font:700 12px/1.2 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.codebox b{font:500 17px/1 var(--font-mono);letter-spacing:.08em;margin-left:6px}
.gst{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 9px;margin:0 4px 4px 0}
.gst .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;width:24px;height:24px;border-radius:50%;padding:0}
.userrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.userrow .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.rolesel{width:auto;flex:none;min-height:38px;padding:6px 8px;font-size:14px}
.steps{margin:8px 0 12px;padding-left:20px;font-size:14px;display:grid;gap:4px}
.pos-icon{background:none;border:0;overflow:visible}
.pos-dot{width:32px;height:32px;border-radius:50%;background:#1a73e8;color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);display:grid;place-items:center;font:700 12px/1 var(--font-body);flex:none}
.pos-name{position:absolute;top:34px;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 11px/1.2 var(--font-body);background:var(--surface);color:var(--fg);padding:1px 5px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.vitem{padding:9px 0;border-bottom:1px solid var(--line)}
.vname{font-weight:600;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.vrow{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;margin-top:3px}
.vper{font-variant-numeric:tabular-nums;font-weight:500}
.vcls{color:var(--muted)}
.vnote{color:var(--accent);flex-basis:100%}
.vmore{margin-top:18px}
.vmore summary{cursor:pointer;font:700 14px/1.2 var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 0}
/* Svamp */
.bigtoggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.bigtoggle strong{font:700 18px/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.species{display:grid;gap:2px}
.sp-row{display:flex;align-items:center;gap:10px;padding:7px 2px;cursor:pointer}
.sp-row input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.sp-row .spn{flex:1;min-width:0}
.sp-row .spn i{color:var(--muted);font-size:12px;margin-left:4px}
.sp-row .spc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.2em}
.status.err{color:var(--danger)}

/* Modal */
.modal-back{position:fixed;inset:0;background:var(--scrim);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@supports (max-height:92dvh){.modal{max-height:92dvh}}
@media (min-width:600px){.modal-back{align-items:center}.modal{border-radius:18px;padding:22px}}
.modal h2{font:700 24px/1.1 var(--font-display);letter-spacing:.02em;margin:0 0 14px;text-wrap:balance}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal .actions .grow{flex:1}
.coordbox{font:400 13px/1.55 var(--font-mono);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.coordbox b{font-family:var(--font-body);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:inline-block;width:108px}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.icon-opt{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;padding:0;color:var(--fg)}
.icon-opt svg{width:22px;height:22px}
.icon-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.icon-opt .aa{font:700 15px/1 var(--font-body)}
.colors{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.color-opt{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.color-opt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
input[type=color].color-opt{background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=color].color-opt::-webkit-color-swatch-wrapper{padding:0}
input[type=color].color-opt::-webkit-color-swatch{border:0;border-radius:50%}
.preview{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);margin-bottom:14px}
.checkline{display:flex;gap:10px;align-items:flex-start;margin:6px 0 2px}
.checkline input{accent-color:var(--accent);width:18px;height:18px;margin:2px 0 0;flex:none}
.radio-card{display:block;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.radio-card > label{display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:8px}
.radio-card input[type=radio]{accent-color:var(--accent);width:18px;height:18px;margin:0}

/* Popup-innehåll */
.pp h4{margin:0 0 4px;font:700 18px/1.15 var(--font-display);letter-spacing:.02em}
.pp .ptype{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:6px}
.pp .pnote{margin:6px 0;white-space:pre-wrap}

/* ---------- SWEREF 99 TM (Gauss–Krüger, Lantmäteriets formler) ---------- */
function toSweref99TM(lat, lon){
  const a = 6378137, f = 1/298.257222101, k0 = 0.9996, lon0 = 15*DEG, FN = 0, FE = 500000;

/* ---------- GBIF / Artportalen ---------- */
const gbif = {results:{}, busy:false, status:'', err:false};
async function fetchJson(url){
  const r = await fetch(url, {headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function resolveKey(sp){
  const keys = state.settings.gbif.keys, cached = keys[sp.sci];
  if(cached && cached.key && Date.now() - cached.t < 30*864e5) return cached.key;
  let key = null;
  try {
    const d = await fetchJson('https://api.gbif.org/v1/species/match?kingdom=Fungi&name=' + encodeURIComponent(sp.sci));
    if(d && d.matchType !== 'NONE') key = d.acceptedUsageKey || d.usageKey || null;
  } catch(e){}
  if(!key){
    try {
      const d = await fetchJson('https://api.gbif.org/v2/species/match?kingdom=Fungi&scientificName=' + encodeURIComponent(sp.sci));
      key = (d && ((d.acceptedUsage && d.acceptedUsage.key) || (d.usage && d.usage.key))) || null;
    } catch(e){}
  }
  if(key){ keys[sp.sci] = {key, t:Date.now()}; save(); }
  return key;
}
async function fetchSpecies(sp, b){
  const key = await resolveKey(sp);
  const p = new URLSearchParams({hasCoordinate:'true', hasGeospatialIssue:'false', occurrenceStatus:'PRESENT',
    decimalLatitude:`${b.s.toFixed(4)},${b.n.toFixed(4)}`, decimalLongitude:`${b.w.toFixed(4)},${b.e.toFixed(4)}`, limit:'300'});
  if(key) p.set('taxonKey', key); else p.set('scientificName', sp.sci);
  const from = +state.settings.gbif.fromYear;
  if(from) p.set('year', `${from},${new Date().getFullYear()}`);
  const out = [], seen = new Set(); let count = 0, offset = 0;
  for(let page = 0; page < 3; page++){
    p.set('offset', String(offset));
    const d = await fetchJson('https://api.gbif.org/v1/occurrence/search?' + p.toString());
    count = d.count || 0;
    for(const o of (d.results || [])){
      if(o.decimalLatitude == null || o.decimalLongitude == null || seen.has(o.key)) continue;
      seen.add(o.key);
      out.push({key:o.key, lat:o.decimalLatitude, lng:o.decimalLongitude,
        date:(o.eventDate ? String(o.eventDate).slice(0,10) : (o.year ? String(o.year) : '')),
        unc:o.coordinateUncertaintyInMeters || null, loc:o.locality || '', ds:o.datasetName || ''});
    }
    offset += 300;
    if(d.endOfRecords || offset >= count) break;
  }
  return {key, count, points:out};
}
async function loadGbifInView(){
  if(gbif.busy) return;
  const sel = state.settings.gbif.species.map(speciesById).filter(Boolean);
  if(!sel.length){ setGbifStatus('Välj minst en art.', true); return; }
  if(map.getZoom() < 9){ setGbifStatus('Zooma in mer först (ungefär kommunnivå) så att sökningen blir hanterbar.', true); return; }
  if(!state.settings.svampMode){ setSvampMode(true); }
  const bb = map.getBounds(), b = {s:bb.getSouth(), n:bb.getNorth(), w:bb.getWest(), e:bb.getEast()};
  gbif.busy = true; setGbifStatus('Hämtar fynd från Artportalen via GBIF …'); renderSvampPane();
  let errors = 0;
  await Promise.all(sel.map(async sp => {
    try { gbif.results[sp.id] = await fetchSpecies(sp, b); }
    catch(e){ errors++; gbif.results[sp.id] = {error:true, count:0, points:[]}; }
  }));
  gbif.busy = false;
  const shown = sel.reduce((n,sp) => n + (gbif.results[sp.id].points || []).length, 0);
  const total = sel.reduce((n,sp) => n + (gbif.results[sp.id].count || 0), 0);
  if(errors === sel.length) setGbifStatus('Kunde inte nå GBIF. Kontrollera nätverket och försök igen.', true);
  else setGbifStatus(`${fmtInt(shown)} fynd visas${total > shown ? ` av ${fmtInt(total)} – zooma in för att se alla` : ''}.${errors ? ' Vissa arter kunde inte hämtas.' : ''}`);
  renderGbif(); renderDensity(); renderSvampPane();
}
function setGbifStatus(msg, err){ gbif.status = msg; gbif.err = !!err; const s = $('#gbifStatus'); if(s){ s.textContent = msg; s.classList.toggle('err', !!err); } }

      c.bindPopup(() => gbifPopup(sp, pt), {maxWidth:280});

}

let sheet = 'peek';
function peekH(){ return $('#handle').offsetHeight + $('#pHead').offsetHeight + $('.tabs').offsetHeight; }
function sheetHeight(s){
  const vh = window.innerHeight;
  if(s === 'full') return Math.round(vh - 64);
  if(s === 'half') return Math.round(Math.min(vh*0.52, vh - 120));
  return peekH();
}
function setSheet(s, noAnim){
  sheet = s;
  $('#panel').classList.toggle('peek', s === 'peek' && !isDesktop());
  if(isDesktop()){ document.documentElement.style.setProperty('--sheet-h','0px'); $('#panel').style.height = ''; return; }
  const px = sheetHeight(s);
  const panel = $('#panel');
  if(noAnim) panel.classList.add('dragging');
  document.documentElement.style.setProperty('--sheet-h', px + 'px');
  panel.style.height = `calc(${px}px + env(safe-area-inset-bottom, 0px))`;
  if(noAnim) requestAnimationFrame(() => panel.classList.remove('dragging'));
}
function bottomPad(){ return isDesktop() ? 0 : (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sheet-h')) || 0); }
(function sheetDrag(){
  const panel = $('#panel'); let startY = 0, startH = 0, moved = false, active = false;
  const down = e => { if(isDesktop()) return; active = true; moved = false; startY = e.clientY; startH = panel.getBoundingClientRect().height; panel.classList.add('dragging'); e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => { if(!active) return; const dy = startY - e.clientY; if(Math.abs(dy) > 6) moved = true; if(!moved) return;
    const hpx = Math.max(peekH(), Math.min(window.innerHeight - 40, startH + dy)); panel.style.height = hpx + 'px'; document.documentElement.style.setProperty('--sheet-h', hpx + 'px'); };
  const up = e => { if(!active) return; active = false; panel.classList.remove('dragging');
    if(!moved){ if(e.currentTarget.id === 'handle') setSheet(sheet === 'peek' ? 'half' : sheet === 'half' ? 'full' : 'peek'); else setSheet(sheet); return; }
    const hpx = panel.getBoundingClientRect().height, opts = ['peek','half','full'];
    let best = 'peek', bd = Infinity; for(const o of opts){ const d = Math.abs(sheetHeight(o) - hpx); if(d < bd){ bd = d; best = o; } }
    setSheet(best); };
  for(const el of [$('#handle'), $('#pHead')]){
    el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
})();
function setTab(tab){
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $$('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== tab; });
  $('#pBody').scrollTop = 0;
  if(sheet === 'peek' && !isDesktop()) setSheet('half');
}

  } else {

    const row = p => {

    };

      }

/* ---------- Händelser i panelen ---------- */
const armed = new WeakMap();
function confirmClick(btn, label, fn){
  if(armed.get(btn)){ armed.delete(btn); fn(); return; }
  const old = btn.innerHTML; btn.classList.add('armed');
  if(!btn.classList.contains('iconbtn')) btn.textContent = label;
  btn.setAttribute('aria-label', label);
  armed.set(btn, true);
  setTimeout(() => { if(armed.get(btn)){ armed.delete(btn); btn.classList.remove('armed'); btn.innerHTML = old; } }, 3500);
}
$('#panel').addEventListener('click', e => {

  if(act === 'goto') gotoPin(id);

  else if(act === 'clear-ex'){ clearExamples(); }
  else if(act === 'areas-all' || act === 'areas-none'){ const v = act === 'areas-all'; state.areas.forEach(a => a.visible = v); state.settings.noAreaVisible = v; save(); renderAll(); }
  else if(act === 'area-edit') openAreaForm(id);
  else if(act === 'area-del'){ const a = areaById(id); confirmClick(b, 'Bekräfta', () => { state.pins.forEach(p => { if(p.areaId === id) p.areaId = null; }); state.areas = state.areas.filter(x => x.id !== id); save(); renderAll(); toast(a.gid ? `”${a.name}” togs bort för hela laget. Nålarna ligger nu privat hos dig under Utan område.` : `”${a.name}” togs bort. Nålarna ligger nu under Utan område.`, 5000); }); }
  else if(act === 'type-new') openTypeForm(null);
  else if(act === 'type-edit') openTypeForm(id);
  else if(act === 'import-ext'){ importTarget = 'ext'; $('#fileImport').click(); }
  else if(act === 'import'){ importTarget = null; $('#fileImport').click(); }
  else if(act === 'ext-del'){ confirmClick(b, 'Bekräfta', () => { state.external = state.external.filter(x => x.id !== id); save(); renderAll(); }); }
  else if(act === 'export-json') exportJson();
  else if(act === 'export-gpx') exportGpx();
  else if(act === 'export-geojson') exportGeojson();
  else if(act === 'wipe') confirmClick(b, 'Tryck igen för att radera allt', () => { const keep = new Set(state.areas.filter(a => a.gid).map(a => a.id)); state.pins = state.pins.filter(p => keep.has(p.areaId)); state.areas = state.areas.filter(a => a.gid); state.external = []; gbif.results = {}; save(); renderAll(); renderGbif(); toast(keep.size ? 'Dina privata nålar är raderade. Delade områden finns kvar.' : 'Allt raderat'); });
});
$('#panel').addEventListener('change', e => {

/* ---------- Modal ---------- */
let modalEl = null, lastFocus = null;
function openModal(html, onReady){
  closeModal();
  lastFocus = document.activeElement;
  modalEl = h(`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`);
  modalEl.addEventListener('click', e => { if(e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  if(onReady) onReady(modalEl.querySelector('.modal'));
  const f = modalEl.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select,textarea');
  if(f && isDesktop()) f.focus();
}
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl = null; if(lastFocus && lastFocus.focus) try{ lastFocus.focus(); }catch(e){} } }
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if(modalEl) closeModal(); else if(!$('#layerPop').hidden) toggleLayerPop(false); else if(placing) endPlacing(); } });

function areaOptions(sel){
  return `<option value="">Utan område (privat)</option>${state.areas.filter(canEditArea).map(a => `<option value="${a.id}"${a.id === sel ? ' selected' : ''}>${esc(a.name)}${a.gid ? ' · delat' : ''}</option>`).join('')}<option value="__new">+ Nytt område …</option>`;
}
function typeOptions(sel){ return state.types.map(t => `<option value="${t.id}"${t.id === sel ? ' selected' : ''}>${esc(t.name)}${t.svamp ? ' (svamp)' : ''}</option>`).join(''); }
function wireNewArea(m, selId, inputId){
  const sel = m.querySelector('#' + selId), inp = m.querySelector('#' + inputId);
  sel.addEventListener('change', () => { inp.hidden = sel.value !== '__new'; if(!inp.hidden) inp.focus(); });
}
function resolveArea(m, selId, inputId){
  const sel = m.querySelector('#' + selId).value;
  if(sel !== '__new') return sel || null;
  const name = m.querySelector('#' + inputId).value.trim(); if(!name) return null;
  const ex = state.areas.find(a => a.name.toLowerCase() === name.toLowerCase()); if(ex) return ex.id;
  const a = {id:uid(), name, visible:true}; state.areas.push(a); return a.id;
}

/* Nålformulär. opts: {id} för att redigera, annars {lat,lng,name,note,typeId,areaId} */
let lastTypeId = null, lastAreaId = null;
function openPinForm(opts){
  const editing = !!opts.id; const p = editing ? pinById(opts.id) : null;
  if(editing && !p) return;
  if(editing && !canEditPin(p)){ toast('Du har inte rättighet att ändra nålar i det området.'); return; }
  const fromPin = editing && !opts.draft;
  const lat = editing ? p.lat : opts.lat, lng = editing ? p.lng : opts.lng;
  let typeId = opts.typeId || (editing ? p.typeId : null) || (state.settings.svampMode ? (state.types.find(t => t.svamp) || {}).id : null) || lastTypeId || state.types[0].id;
  if(!typeById(typeId)) typeId = state.types[0].id;
  let areaId = fromPin ? p.areaId : (opts.areaId !== undefined ? opts.areaId : lastAreaId);
  if(areaId && !areaById(areaId)) areaId = null;
  const nameVal = fromPin ? p.name : (opts.name || ''), noteVal = fromPin ? p.note : (opts.note || '');
  openModal(`<h2>${editing ? 'Ändra nål' : 'Ny nål'}</h2>
    <form id="pinForm">
      <label class="field"><span>Namn</span><input class="input" id="pfName" maxlength="80" value="${esc(nameVal)}" placeholder="t.ex. Tornet vid mossen"></label>

      </div>
      <label class="field"><span>Anteckning</span><textarea class="input" id="pfNote" maxlength="2000" placeholder="Vindriktning, bästa tid, nyckel …">${esc(noteVal)}</textarea></label>
      <div class="coordbox"><b>WGS 84</b>${fmtLatLng(lat,lng)}<br><b>SWEREF 99 TM</b>${fmtSweref(lat,lng)}</div>
      <div class="actions">
        <button class="btn primary grow" type="submit">Spara</button>
        ${editing ? `<button class="btn" type="button" id="pfMove">Flytta</button><a class="btn" href="${navUrl(lat,lng)}" target="_blank" rel="noopener">${ICON_NAV}Navigera</a><button class="btn danger" type="button" id="pfDel">Ta bort</button>` : ''}
        <button class="btn ghost" type="button" id="pfCancel">Avbryt</button>
      </div>
    </form>`, m => {
    wireNewArea(m, 'pfArea', 'pfAreaNew');
    const collect = () => ({lat, lng, name:m.querySelector('#pfName').value.trim(), note:m.querySelector('#pfNote').value, typeId:typeId, areaId:m.querySelector('#pfArea').value === '__new' ? areaId : (m.querySelector('#pfArea').value || null)});
    m.querySelector('#pfType').addEventListener('change', e => {
      if(e.target.value !== '__new'){ typeId = e.target.value; return; }
      const draft = collect(); closeModal();
      openTypeForm(null, newType => openPinForm(Object.assign(editing ? {id:opts.id, draft:true} : {}, draft, {typeId:newType ? newType.id : draft.typeId})));
    });
    m.querySelector('#pfCancel').addEventListener('click', closeModal);
    m.querySelector('#pinForm').addEventListener('submit', e => {
      e.preventDefault();
      const tId = m.querySelector('#pfType').value; if(!typeById(tId)) return;
      const aId = resolveArea(m, 'pfArea', 'pfAreaNew');

      let pin;
      if(editing){ pin = pinById(opts.id); if(!pin){ closeModal(); toast('Nålen finns inte längre.'); return; } Object.assign(pin, {name, note, typeId:tId, areaId:aId, updated:Date.now()}); delete pin.example; }
      else { pin = {id:uid(), name, note, typeId:tId, areaId:aId, lat, lng, created:Date.now(), updated:Date.now()}; state.pins.push(pin); }
      lastTypeId = tId; lastAreaId = aId;
      const t = typeById(tId); const a = aId ? areaById(aId) : null;
      if(!editing){
        if(t.visible === false && !state.settings.svampMode) t.visible = true;

        if(!a) state.settings.noAreaVisible = true;

    }
  });
}

function showMe(lat, lng, acc){

  if(!meMarker){ meMarker = L.marker([lat,lng], {icon:L.divIcon({className:'me-dot', iconSize:[18,18]}), interactive:false, keyboard:false, zIndexOffset:1000}).addTo(map);

function locate(fly){
  if(!('geolocation' in navigator)){ toast('Den här webbläsaren kan inte ge din position.'); return; }
  $('#btnLocate').setAttribute('aria-pressed','true');
  navigator.geolocation.getCurrentPosition(pos => {
    showMe(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy || 0);
    if(fly) map.setView([myPos.lat,myPos.lng], Math.max(map.getZoom(), 15));
    renderList();

    $('#btnLocate').setAttribute('aria-pressed','false');

function download(name, text, mime){
  const blob = new Blob([text], {type:mime}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
const stamp = () => new Date().toISOString().slice(0,10);
function exportJson(){
  const data = {app:'Jaktkartan', version:1, exported:new Date().toISOString(), types:state.types.filter(t => !t.ghost), areas:state.areas.map(a => { const c = Object.assign({}, a); delete c.gid; return c; }), pins:state.pins, external:state.external};
  download(`jaktkartan-${stamp()}.json`, JSON.stringify(data, null, 1), 'application/json');

}
const xmlEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function exportGpx(){
  const pins = state.pins.filter(pinVisible);

  const wpts = pins.map(p => { const t = typeById(p.typeId), a = p.areaId ? areaById(p.areaId) : null;
    return `  <wpt lat="${p.lat.toFixed(7)}" lon="${p.lng.toFixed(7)}">\n    <name>${xmlEsc(p.name || t.name)}</name>\n    <desc>${xmlEsc([t.name, a ? a.name : '', p.note].filter(Boolean).join(' – '))}</desc>\n    <type>${xmlEsc(t.name)}</type>\n  </wpt>`; }).join('\n');
  download(`jaktkartan-${stamp()}.gpx`, `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Jaktkartan" xmlns="http://www.topografix.com/GPX/1/1">\n${wpts}\n</gpx>\n`, 'application/gpx+xml');
  toast(`${pins.length} nålar exporteras som GPX`);
}
function exportGeojson(){
  const pins = state.pins.filter(pinVisible);
  if(!pins.length){ toast('Inga synliga nålar att exportera.'); return; }
  const fc = {type:'FeatureCollection', features:pins.map(p => { const t = typeById(p.typeId), a = p.areaId ? areaById(p.areaId) : null;
    return {type:'Feature', geometry:{type:'Point', coordinates:[+p.lng.toFixed(7), +p.lat.toFixed(7)]}, properties:{name:p.name || t.name, typ:t.name, omrade:a ? a.name : null, anteckning:p.note || null, farg:t.color}}; })};
  download(`jaktkartan-${stamp()}.geojson`, JSON.stringify(fc, null, 1), 'application/geo+json');
  toast(`${pins.length} nålar exporteras som GeoJSON`);
}

/* ---------- Import ---------- */
let importTarget = null;
const numOk = v => typeof v === 'number' && isFinite(v);
function parseNum(s){ if(typeof s === 'number') return s; if(s == null) return NaN; return parseFloat(String(s).trim().replace(/\s/g,'').replace(',', '.')); }
function validLL(lat,lng){ return numOk(lat) && numOk(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180; }
function parseGeoJSON(obj){
  const out = [];
  const feats = obj.type === 'FeatureCollection' ? obj.features : obj.type === 'Feature' ? [obj] : [];
  for(const f of feats || []){
    const g = f && f.geometry; if(!g) continue; const pr = f.properties || {};
    const name = pr.name || pr.namn || pr.title || pr.Name || pr.vernacularName || pr.species || '';
    const note = pr.description || pr.desc || pr.anteckning || pr.note || '';
    const coords = g.type === 'Point' ? [g.coordinates] : g.type === 'MultiPoint' ? g.coordinates : [];
    for(const c of coords){ const lng = +c[0], lat = +c[1]; if(validLL(lat,lng)) out.push({lat,lng,name:String(name),note:typeof note === 'string' ? note : ''}); }
  }
  return out;
}
function stripHtml(s){ const d = document.createElement('div'); d.innerHTML = s || ''; return (d.textContent || '').trim(); }
function parseKML(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('Ogiltig KML');
  const out = [];
  for(const pm of Array.from(doc.getElementsByTagNameNS('*','Placemark'))){
    const nm = pm.getElementsByTagNameNS('*','name')[0], ds = pm.getElementsByTagNameNS('*','description')[0];
    for(const pt of Array.from(pm.getElementsByTagNameNS('*','Point'))){
      const c = pt.getElementsByTagNameNS('*','coordinates')[0]; if(!c) continue;
      const parts = c.textContent.trim().split(/[\s]+/)[0].split(',');
      const lng = parseFloat(parts[0]), lat = parseFloat(parts[1]);
      if(validLL(lat,lng)) out.push({lat,lng,name:nm ? nm.textContent.trim() : '', note:ds ? stripHtml(ds.textContent) : ''});
    }
  }
  return out;
}
function parseGPX(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('Ogiltig GPX');
  const out = [];
  for(const w of Array.from(doc.getElementsByTagNameNS('*','wpt'))){
    const lat = parseFloat(w.getAttribute('lat')), lng = parseFloat(w.getAttribute('lon'));
    const nm = w.getElementsByTagNameNS('*','name')[0], ds = w.getElementsByTagNameNS('*','desc')[0] || w.getElementsByTagNameNS('*','cmt')[0];
    if(validLL(lat,lng)) out.push({lat,lng,name:nm ? nm.textContent.trim() : '', note:ds ? ds.textContent.trim() : ''});
  }
  return out;
}
function splitCsvLine(line, d){
  const out = []; let cur = '', q = false;
  for(let i = 0; i < line.length; i++){
    const c = line[i];
    if(q){ if(c === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true; else if(c === d){ out.push(cur); cur = ''; } else cur += c;
  }
  out.push(cur); return out.map(s => s.trim());
}
function parseCSV(text){
  const lines = text.replace(/^﻿/,'').split(/\r?\n/).filter(l => l.trim());
  if(lines.length < 2) return [];
  const first = lines[0];
  const d = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const head = splitCsvLine(first, d).map(s => s.toLowerCase().replace(/^"|"$/g,''));
  const find = names => head.findIndex(h => names.includes(h));
  const iLat = find(['lat','latitude','latitud','decimallatitude','y','breddgrad']);
  const iLng = find(['lon','lng','long','longitude','longitud','decimallongitude','x','längdgrad']);
  const iName = find(['name','namn','title','titel','art','species','vernacularname','svenskt namn','artnamn']);
  const iNote = find(['note','notes','anteckning','description','beskrivning','lokal','locality','datum','date','eventdate']);
  if(iLat < 0 || iLng < 0) throw new Error('Hittade inga kolumner för latitud och longitud');
  const out = [];
  for(const l of lines.slice(1)){
    const c = splitCsvLine(l, d); const lat = parseNum(c[iLat]), lng = parseNum(c[iLng]);
    if(validLL(lat,lng)) out.push({lat,lng,name:iName >= 0 ? c[iName] : '', note:iNote >= 0 ? c[iNote] : ''});
  }
  return out;
}
$('#fileImport').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if(!file) return;
  let text;
  try { text = await file.text(); } catch(err){ toast('Kunde inte läsa filen.'); return; }
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  try {
    if(ext === 'json' || ext === 'geojson' || /^\s*[{[]/.test(text)){
      const obj = JSON.parse(text);
      if(obj && Array.isArray(obj.pins) && Array.isArray(obj.types)) return openBackupImport(obj, file.name);
      const pts = parseGeoJSON(obj); return openPointImport(pts, file.name);
    }
    if(ext === 'kml' || /<kml[\s>]/i.test(text)) return openPointImport(parseKML(text), file.name);
    if(ext === 'gpx' || /<gpx[\s>]/i.test(text)) return openPointImport(parseGPX(text), file.name);
    return openPointImport(parseCSV(text), file.name);
  } catch(err){ toast('Filen kunde inte läsas: ' + (err.message || 'okänt format')); }
});
function openBackupImport(obj, fname){
  const n = obj.pins.length;
  openModal(`<h2>Importera säkerhetskopia</h2><p>${esc(fname)} innehåller ${n} ${n === 1 ? 'nål' : 'nålar'}, ${obj.types.length} typer och ${(obj.areas||[]).length} områden.</p>
    <div class="radio-card"><label><input type="radio" name="bm" value="merge" checked>Slå ihop med det jag har</label><span class="small muted">Nålar som redan finns uppdateras, nya läggs till.</span></div>
    <div class="radio-card"><label><input type="radio" name="bm" value="replace">Ersätt allt</label><span class="small muted">Det som finns nu raderas.</span></div>
    <div class="actions"><button class="btn primary grow" type="button" id="biOk">Importera</button><button class="btn ghost" type="button" id="biCancel">Avbryt</button></div>`, m => {
    m.querySelector('#biCancel').addEventListener('click', closeModal);
    m.querySelector('#biOk').addEventListener('click', () => {
      const mode = m.querySelector('input[name=bm]:checked').value;
      const inc = normalize(obj);
      const cg = {}; state.areas.forEach(a => { if(a.gid) cg[a.id] = a.gid; });
      const keepAreas = state.areas.filter(a => a.gid), keepPins = state.pins.filter(p => cg[p.areaId]);
      inc.areas = inc.areas.filter(a => !cg[a.id]); inc.pins = inc.pins.filter(p => !cg[p.areaId] && !keepPins.some(k => k.id === p.id));
      inc.areas.forEach(a => { delete a.gid; });
      if(mode === 'replace'){ state.types = inc.types; state.areas = inc.areas.concat(keepAreas); state.pins = inc.pins.concat(keepPins); state.external = inc.external; }
      else {
        const mergeBy = (cur, add) => { for(const x of add){ const i = cur.findIndex(c => c.id === x.id); if(i >= 0) cur[i] = x; else cur.push(x); } };
        mergeBy(state.types, inc.types); mergeBy(state.areas, inc.areas); mergeBy(state.pins, inc.pins); mergeBy(state.external, inc.external);
      }
      state.pins = state.pins.filter(p => typeById(p.typeId));
      save(); closeModal(); renderAll(); fitAll(); toast('Säkerhetskopian är importerad');
    });
  });
}
function openPointImport(pts, fname){
  if(!pts.length){ toast('Hittade inga punkter i filen.'); return; }
  const baseName = fname.replace(/\.[^.]+$/, '');
  const svType = state.types.find(t => t.svamp) || state.types[0];
  const asExt = importTarget === 'ext';
  openModal(`<h2>Importera ${pts.length} ${pts.length === 1 ? 'punkt' : 'punkter'}</h2><p class="small muted" style="margin-top:-6px">${esc(fname)}</p>
    <div class="radio-card"><label><input type="radio" name="im" value="ext" ${asExt ? 'checked' : ''}>Som svampkälla</label><span class="small muted">Visas som ringar när svampkartan är på. Du kan spara enskilda ställen som egna nålar.</span>
      <div class="row2" style="margin-top:10px"><label class="field"><span>Namn på källan</span><input class="input" id="imSrc" value="${esc(baseName)}" maxlength="60"></label><label class="field"><span>Färg</span><input type="color" class="input" id="imColor" value="#0f766e" style="padding:4px;height:44px"></label></div></div>
    <div class="radio-card"><label><input type="radio" name="im" value="pins" ${asExt ? '' : 'checked'}>Som egna nålar</label>
      <div class="row2"><label class="field"><span>Typ</span><select class="input" id="imType">${typeOptions(asExt ? svType.id : state.types[0].id)}</select></label>
      <label class="field"><span>Område</span><select class="input" id="imArea">${areaOptions(null)}</select><input class="input" id="imAreaNew" placeholder="Namn på nytt område" value="${esc(baseName)}" hidden maxlength="60"></label></div></div>
    <div class="actions"><button class="btn primary grow" type="button" id="imOk">Importera</button><button class="btn ghost" type="button" id="imCancel">Avbryt</button></div>`, m => {
    wireNewArea(m, 'imArea', 'imAreaNew');
    m.querySelector('#imCancel').addEventListener('click', closeModal);
    m.querySelector('#imOk').addEventListener('click', () => {
      const mode = m.querySelector('input[name=im]:checked').value;
      if(mode === 'ext'){
        state.external.push({id:uid(), name:m.querySelector('#imSrc').value.trim() || baseName, color:m.querySelector('#imColor').value, visible:true, points:pts.map(p => ({lat:+p.lat.toFixed(7), lng:+p.lng.toFixed(7), name:(p.name||'').slice(0,120), note:(p.note||'').slice(0,500)}))});
        save(); closeModal();
        if(!state.settings.svampMode) setSvampMode(true); else renderAll();
        fitAll(); toast(`${pts.length} svampställen importerades`);
      } else {
        const tId = m.querySelector('#imType').value, aId = resolveArea(m, 'imArea', 'imAreaNew');
        const now = Date.now();
        for(const p of pts) state.pins.push({id:uid(), name:(p.name||'').slice(0,80), note:(p.note||'').slice(0,2000), typeId:tId, areaId:aId, lat:p.lat, lng:p.lng, created:now, updated:now});
        const t = typeById(tId); if(!state.settings.svampMode) t.visible = true; if(aId) areaById(aId).visible = true; else state.settings.noAreaVisible = true;
        save(); closeModal(); renderAll(); fitAll(); toast(`${pts.length} nålar importerades`);
      }
      importTarget = null;
    });
  });
}

const v = state.settings.view;
if(v && isFinite(v.lat)) map.setView([v.lat, v.lng], v.z || 12);
else map.setView([62.5, 16.5], 5);

window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { setSheet(sheet, true); map.invalidateSize(); }, 120); });

})();
