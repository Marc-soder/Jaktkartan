/* Jakt-fliken */
function huntChips(hunt){ const ids = Object.keys(hunt.species || {}).filter(k => hunt.species[k]); return ids.length ? `<div class="chips">${ids.map(id => `<span class="chip">${esc((viltById(id) || {name:id}).name)}</span>`).join('')}</div>` : '<div class="small muted">Inget vilt valt.</div>'; }
const fmtDay = d => d ? `${+d.slice(8)} ${MON[+d.slice(5,7) - 1]} ${d.slice(0,4)}` : '';
const fmtTime = t => { const d = new Date(t); return `${fmtDay(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)} kl. ${String(d.getHours()).padStart(2,'0')}.${String(d.getMinutes()).padStart(2,'0')}`; };
function huntCard(g, hid, hunt, lead){
  const now = Date.now(), live = hunt.expires > now, upcoming = live && hunt.starts > now;

/* ---------- Förstoringsglas ----------
   En liten karta som visar det som ligger under en punkt, 3 gånger större än huvudkartan.
   Visas ovanför punkten när man placerar en nål med korset, passar in en skärmdump,
   lägger till en punkt i en gräns eller drar en punkt. */
const LOUPE_ZOOM = Math.log2(3), LOUPE_SIZE = 150;
const loupe = {el:null, map:null, base:null, baseKey:null, vec:null, shots:null, timer:null, on:false};
function loupeInit(){
  if(loupe.map) return;
  loupe.el = h(`<div class="loupe" aria-hidden="true" hidden><div class="loupe-map"></div><svg class="loupe-cross" viewBox="0 0 40 40" fill="none" stroke-linecap="round"><path d="M20 4v11M20 25v11M4 20h11M25 20h11" stroke="#fff" stroke-width="5"/><path d="M20 4v11M20 25v11M4 20h11M25 20h11" stroke="#d9520e" stroke-width="2.5"/><circle cx="20" cy="20" r="2" fill="#d9520e"/></svg><span class="loupe-tag">3×</span></div>`);
  map.getContainer().appendChild(loupe.el);
  loupe.el.hidden = false; // Leaflet behöver en synlig behållare när kartan skapas
  loupe.map = L.map(loupe.el.firstElementChild, {zoomControl:false, attributionControl:false, zoomSnap:0, zoomAnimation:false, fadeAnimation:false,
    dragging:false, touchZoom:false, scrollWheelZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false, tap:false, inertia:false});
  loupe.map.createPane('shot'); loupe.map.getPane('shot').style.zIndex = 300;
  loupe.vec = L.layerGroup().addTo(loupe.map); loupe.shots = L.layerGroup().addTo(loupe.map);
  loupe.el.hidden = true;
}
function loupeBase(){
  const key = state.settings.base in BASES ? state.settings.base : 'osm';
  if(loupe.baseKey === key) return;
  if(loupe.base) loupe.map.removeLayer(loupe.base);
  loupe.base = BASES[key].make().addTo(loupe.map); loupe.baseKey = key;
}
/* Ritar gränser, vägar, utkastet och synliga skärmdumpar i förstoringsglaset. */
function loupeLayers(){
  loupe.vec.clearLayers(); loupe.shots.clearLayers();
  for(const a of state.areas){

  const el = name => Array.from(doc.getElementsByTagNameNS('*', name));
  const coords = n => n.textContent.trim().split(/\s+/).map(t => t.split(',')).filter(c => c.length >= 2).map(c => [+c[1], +c[0]]);
  for(const tag of ['Polygon', 'LineString']){ const n = el(tag)[0]; if(n){ const c = n.getElementsByTagNameNS('*', 'coordinates')[0]; if(c) return coords(c); } }
  for(const tag of ['trkpt', 'rtept']){ const pts = el(tag); if(pts.length) return pts.map(p => [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))]); }
  return [];
}
let borderTarget = null;
$('#fileBorder').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = ''; const a = areaById(borderTarget);
  if(!file || !a) return;
  try {
    let pts = parseRing(await file.text()).filter(p => isFinite(p[0]) && isFinite(p[1]) && Math.abs(p[0]) <= 90 && Math.abs(p[1]) <= 180);
    if(pts.length > 1 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]) pts.pop();
    if(pts.length < 3){ toast('Hittade ingen yta eller linje med minst tre punkter i filen.', 5000); return; }
    if(pts.length > 2000){ const step = Math.ceil(pts.length / 2000); pts = pts.filter((p, i) => i % step === 0); }
    const rings = areaRings(a).concat([pts]);
    setRings(a, rings); a.updated = Date.now(); delete a.example;
    closeModal(); save(); renderAll();
    map.fitBounds(L.latLngBounds(pts), {paddingTopLeft:[40,70], paddingBottomRight:[40, bottomPad() + 40], maxZoom:16});
    toast(rings.length > 1 ? `En ny gränsdel är importerad till ${a.name}, ${fmtHa(areaHa(pts))}.` : `Gränsen för ${a.name} är importerad, ${fmtHa(areaHa(pts))}.`);
  } catch(err){ toast('Filen kunde inte läsas som en gräns.', 5000); }
});

/* ---------- Skogsvägar och stigar från OpenStreetMap (Overpass) ---------- */
const roadLayer = L.layerGroup().addTo(map), roads = {box:null, busy:false, timer:null, note:''};
function setRoadNote(t){ roads.note = t; const el = $('#roadNote'); if(el) el.textContent = t || 'Från OpenStreetMap, syns när du zoomat in'; }
function roadsUpdate(){
  if(!state.settings.roads){ roadLayer.clearLayers(); roads.box = null; setRoadNote(''); return; }
  if(map.getZoom() < 13){ roadLayer.clearLayers(); roads.box = null; setRoadNote('Zooma in mer för att se dem.'); return; }
  if(roads.busy || (roads.box && roads.box.contains(map.getBounds()))) return;
  const pb = map.getBounds().pad(0.3); roads.busy = true; setRoadNote('Hämtar …');
  const q = `[out:json][timeout:20];way["highway"~"^(track|path|service|unclassified)$"](${pb.getSouth().toFixed(4)},${pb.getWest().toFixed(4)},${pb.getNorth().toFixed(4)},${pb.getEast().toFixed(4)});out geom;`;
  fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q)).then(r => { if(!r.ok) throw new Error('http'); return r.json(); }).then(d => {
    roadLayer.clearLayers(); let n = 0;
    for(const w of d.elements || []){
      if(w.type !== 'way' || !Array.isArray(w.geometry) || w.geometry.length < 2) continue;
      const path = (w.tags || {}).highway === 'path', pts = w.geometry.map(g => [g.lat, g.lon]);
      L.polyline(pts, {renderer:canvasR, color:'#ffffff', weight:path ? 3.5 : 5.5, opacity:.8, interactive:false}).addTo(roadLayer);
      L.polyline(pts, {renderer:canvasR, color:path ? '#7a2e8f' : '#8a4b12', weight:path ? 1.8 : 2.8, dashArray:path ? '5 5' : null, interactive:false}).addTo(roadLayer);
      n++;
    }
    roads.box = pb; setRoadNote(n ? `${n} vägar och stigar visas. Brun är väg, lila streckad är stig.` : 'Inga skogsvägar hittades här.');
  }).catch(() => setRoadNote('Kunde inte hämtas just nu. Flytta kartan för att försöka igen.')).then(() => { roads.busy = false; });
}
map.on('moveend', () => { clearTimeout(roads.timer); roads.timer = setTimeout(roadsUpdate, 400); });

/* ---------- Skärmdumpar ovanpå kartan ----------
   Hjälp att rita gränser och lägga ut pass efter en skärmdump (till exempel från Min karta eller en annan jaktapp).
   Man pekar ut två punkter i bilden och samma två punkter i kartan. Appen räknar ut skala, vridning och läge
   och lägger bilden halvgenomskinlig ovanpå kartan. Bilderna ligger kvar tills man tar bort dem och sparas
   bara i den här webbläsaren (bilden i IndexedDB, resten i localStorage). De delas aldrig. */
map.createPane('shot'); map.getPane('shot').style.zIndex = 300; map.getPane('shot').style.pointerEvents = 'none';
const SHOT_META = 'faltkartan.shots', SHOT_MAX = 2400;
let shots = [];   // {id, name, created, w, h, pts:[{u,v,ll},{u,v,ll}], visible, opacity, url, layer}
let cal = null;   // inpassning: {shot, i, step:'img'|'map', isNew, areaId}
let adj = null;   // justering: {shot, handles}

/* --- Lagring --- */
function idb(){
  if(idb.p) return idb.p;
  idb.p = new Promise((ok, no) => {
    try { const r = indexedDB.open('jaktkartan', 1); r.onupgradeneeded = () => r.result.createObjectStore('shots'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch(e){ no(e); }
  });
  return idb.p;
}
const idbDo = (mode, fn) => idb().then(db => new Promise((ok, no) => { const t = db.transaction('shots', mode), r = fn(t.objectStore('shots')); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); }));
const idbPut = (id, blob) => idbDo('readwrite', s => s.put(blob, id)).catch(() => {});
const idbGet = id => idbDo('readonly', s => s.get(id)).catch(() => null);
const idbDel = id => idbDo('readwrite', s => s.delete(id)).catch(() => {});
const calibrated = s => s && s.pts.length === 2 && s.pts.every(p => p && p.ll && p.u != null);
function saveShots(){ lsSet(SHOT_META, JSON.stringify(shots.filter(calibrated).map(s => ({id:s.id, name:s.name, created:s.created, w:s.w, h:s.h, pts:s.pts, visible:s.visible, opacity:s.opacity})))); }
async function loadShots(){
  let meta = [];
  try { meta = JSON.parse(lsGet(SHOT_META) || '[]'); } catch(e){}
  for(const m of Array.isArray(meta) ? meta : []){
    const blob = await idbGet(m.id);
    if(!blob || !calibrated(m)) continue;
    const s = Object.assign({}, m, {url:URL.createObjectURL(blob)});
    shots.push(s); if(s.visible) showShot(s);
  }
  if(shots.length !== meta.length) saveShots();
  renderShotList();
}

/* --- Avbildning ---
   Likformighetsavbildning (skala, vridning, förflyttning) från bildpixel till kartans lagerpunkt, som komplexa tal p = a·u + b.
   Räknas utan Leaflets avrundning till hela pixlar, som annars ger fel som växer längre från punkterna. */
const exactLayerPoint = (m, ll) => m.project(L.latLng(ll)).subtract(m.getPixelOrigin());
function shotTransform(s, m){
  const [A, B] = s.pts, P1 = exactLayerPoint(m, A.ll), P2 = exactLayerPoint(m, B.ll);
  const dx = B.u - A.u, dy = B.v - A.v, px = P2.x - P1.x, py = P2.y - P1.y, n = dx * dx + dy * dy;
  const ar = (px * dx + py * dy) / n, ai = (py * dx - px * dy) / n;
  return {ar, ai, bx:P1.x - (ar * A.u - ai * A.v), by:P1.y - (ai * A.u + ar * A.v)};
}
function shotImgToLatLng(s, u, v){
  const t = shotTransform(s, map);
  return map.unproject(L.point(t.ar * u - t.ai * v + t.bx, t.ai * u + t.ar * v + t.by).add(map.getPixelOrigin()));
}
const ShotLayer = L.Layer.extend({
  initialize(s){ this._s = s; },
  onAdd(m){
    const s = this._s, img = this._img = L.DomUtil.create('img', 'shot-img leaflet-zoom-hide', m.getPane('shot'));
    img.src = s.url; img.alt = ''; img.dataset.shot = s.id;
    Object.assign(img.style, {position:'absolute', left:'0', top:'0', width:s.w + 'px', height:s.h + 'px', maxWidth:'none', transformOrigin:'0 0', opacity:s.opacity, pointerEvents:'none'});
    m.on('zoomend viewreset', this._update, this); this._update();
  },
  onRemove(m){ L.DomUtil.remove(this._img); m.off('zoomend viewreset', this._update, this); },
  _update(){ const t = shotTransform(this._s, this._map); this._img.style.transform = `matrix(${t.ar},${t.ai},${-t.ai},${t.ar},${t.bx},${t.by})`; },
  setOpacity(o){ if(this._img) this._img.style.opacity = o; }
});
function showShot(s){ if(!s.layer && calibrated(s)) s.layer = new ShotLayer(s).addTo(map); }
function hideShot(s){ if(s.layer){ map.removeLayer(s.layer); s.layer = null; } }
function refreshShot(s){ if(s.layer) s.layer._update(); }
/* Lager för förstoringsglaset */
const shotLayersFor = m => shots.filter(s => s.visible && calibrated(s)).map(s => new ShotLayer(s));
const shotById = id => shots.find(s => s.id === id);

/* --- Lista i lagermenyn --- */
function renderShotList(){
  const el = $('#shotList'); if(!el) return;
  el.innerHTML = shots.map(s => `<div class="shot-row"><label class="base-opt" style="flex:1;min-width:0"><input type="checkbox" data-shot-vis="${s.id}" ${s.visible ? 'checked' : ''}><span class="shot-name">${esc(s.name)}</span></label><button class="btn sm" type="button" data-shot-edit="${s.id}">Ändra</button></div>`).join('')
    + `<button class="base-opt" type="button" id="shotAdd" style="width:100%;border:0;background:none;text-align:left;color:inherit;font:inherit"><span style="width:18px;text-align:center;font-weight:700;color:var(--accent)">+</span><span><strong>Lägg till skärmdump</strong><small>Ligger kvar tills du tar bort den. Sparas bara i den här telefonen.</small></span></button>`;
}
$('#layerPop').addEventListener('click', e => {
  const ed = e.target.closest('[data-shot-edit]'); if(ed){ toggleLayerPop(false); openShotForm(shotById(ed.dataset.shotEdit)); return; }
  if(e.target.closest('#shotAdd')){ toggleLayerPop(false); startShotAdd(); }
});
$('#layerPop').addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.shotVis; if(!id) return;
  const s = shotById(id); if(!s) return;
  s.visible = e.target.checked; if(s.visible) showShot(s); else hideShot(s); saveShots();
});
function openShotForm(s){
  if(!s) return;
  openModal(`<h2>Skärmdump</h2><form id="seForm">
    <label class="field"><span>Namn</span><input class="input" id="seName" maxlength="60" value="${esc(s.name)}"></label>
    <label class="trail-range" style="padding:0"><span style="display:flex;justify-content:space-between"><strong>Genomskinlighet</strong><span id="seOpTxt">${Math.round(s.opacity * 100)} %</span></span><input type="range" id="seOpacity" min="10" max="100" step="5" value="${Math.round(s.opacity * 100)}"></label>
    <label class="checkline"><input type="checkbox" id="seVis" ${s.visible ? 'checked' : ''}><span>Visa på kartan</span></label>
    <div class="btnrow" style="margin-top:10px"><button class="btn" type="button" id="seAdjust">Flytta, skala och vrid</button><button class="btn" type="button" id="seRedo">Gör om punkterna</button><button class="btn" type="button" id="seDraw">Rita gräns</button></div>
    <div class="actions"><button class="btn primary grow" type="submit">Klar</button><button class="btn danger" type="button" id="seDel">Ta bort</button></div></form>`, m => {
    const keepName = () => { const v = m.querySelector('#seName').value.trim(); if(v) s.name = v; };
    m.querySelector('#seOpacity').addEventListener('input', e => { s.opacity = e.target.value / 100; m.querySelector('#seOpTxt').textContent = e.target.value + ' %'; if(s.layer) s.layer.setOpacity(s.opacity); });
    m.querySelector('#seVis').addEventListener('change', e => { s.visible = e.target.checked; if(s.visible) showShot(s); else hideShot(s); });
    m.querySelector('#seAdjust').addEventListener('click', () => { keepName(); closeModal(); startAdjust(s); });
    m.querySelector('#seRedo').addEventListener('click', () => { keepName(); closeModal(); startCalibration(s, false); });
    m.querySelector('#seDraw').addEventListener('click', () => { keepName(); saveShots(); renderShotList(); openBorderPick(); });
    const del = m.querySelector('#seDel');
    del.addEventListener('click', () => confirmClick(del, 'Bekräfta', () => { closeModal(); deleteShot(s); toast('Skärmdumpen är borttagen.'); }));
    m.querySelector('#seForm').addEventListener('submit', e => { e.preventDefault(); keepName(); saveShots(); renderShotList(); closeModal(); });
  });
}
function deleteShot(s){
  if(adj && adj.shot === s) endAdjust();
  hideShot(s); shots = shots.filter(x => x !== s); idbDel(s.id);
  try { URL.revokeObjectURL(s.url); } catch(e){}
  saveShots(); renderShotList();
}
/* Välj område och börja rita dess gräns, med skärmdumparna kvar under. */
function openBorderPick(areaId){
  const editable = state.areas.filter(a => canEditArea(a));
  if(!editable.length){ toast('Skapa ett område under Filter först.'); return; }
  const sel = areaId || (cal && cal.areaId) || (editable.find(a => !a.example) || editable[0]).id;
  openModal(`<h2>Rita gräns</h2><label class="field"><span>Område</span><select class="input" id="obArea">${editable.map(a => `<option value="${a.id}"${a.id === sel ? ' selected' : ''}>${esc(a.name)}${a.border ? ' (en ny gränsdel läggs till)' : ''}</option>`).join('')}</select></label>
    <div class="actions"><button class="btn primary grow" type="button" id="obGo">Börja rita</button><button class="btn ghost" type="button" id="obCancel">Avbryt</button></div>`, m => {
    m.querySelector('#obCancel').addEventListener('click', closeModal);
    m.querySelector('#obGo').addEventListener('click', () => { const id = m.querySelector('#obArea').value; endAdjust(); cal = null; endCalBar(); startDrawing(id); });
  });
}

/* --- Ny skärmdump och inpassning --- */
function startShotAdd(areaId){ $('#fileOverlay').dataset.area = areaId || ''; $('#fileOverlay').click(); }
$('#fileOverlay').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0], areaId = e.target.dataset.area || null; e.target.value = '';
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast('Välj en bild, till exempel en skärmdump.'); return; }
  const src = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    let w = img.naturalWidth, h = img.naturalHeight;
    const done = blob => {
      const d = new Date(), s = {id:'s-' + uid(), name:`Skärmdump ${d.getDate()}/${d.getMonth() + 1} ${String(d.getHours()).padStart(2, '0')}.${String(d.getMinutes()).padStart(2, '0')}`,
        created:Date.now(), w, h, pts:[{}, {}], visible:true, opacity:.6, url:URL.createObjectURL(blob), blob};
      URL.revokeObjectURL(src); closeModal(); startCalibration(s, true, areaId);
    };
    if(Math.max(w, h) <= SHOT_MAX){ done(file); return; }
    const k = SHOT_MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    c.toBlob(b => done(b), 'image/jpeg', .9);
  };
  img.onerror = () => { URL.revokeObjectURL(src); toast('Bilden kunde inte läsas.'); };
  img.src = src;
});
function startCalibration(s, isNew, areaId){
  endAdjust(); hideShot(s);
  cal = {shot:s, i:0, step:'img', isNew, areaId:areaId || null, old:isNew ? null : JSON.parse(JSON.stringify(s.pts))};
  pickImage(0);
}
function cancelCalibration(){
  if(!cal) return; const s = cal.shot;
  if(cal.isNew){ try { URL.revokeObjectURL(s.url); } catch(e){} }
  else { s.pts = cal.old; if(s.visible) showShot(s); }
  endCalBar(); cal = null;
}
/* Steg 1: punkt i bilden */
function pickImage(i){
  const s = cal.shot; cal.step = 'img'; cal.i = i; endCalBar(true);
  let zoom = 1;
  const p = s.pts[i] || (s.pts[i] = {});
  openModal(`<h2>Punkt ${i + 1} av 2 i bilden</h2>
    <p class="note" style="margin-top:0">Tryck på en plats som är lätt att hitta även i kartan, till exempel en vägkorsning, ett vägslut eller ett hus. ${i ? 'Välj en plats långt från den första.' : 'Den andra punkten ska ligga långt från den här.'}</p>
    <div class="shot-pick" id="ovWrap"><div class="shot-inner" id="ovInner"><img id="ovImg" src="${s.url}" alt="Skärmdumpen"><span class="shot-mark" id="ovMark" hidden></span>${i && s.pts[0].u != null ? `<span class="shot-mark first" style="left:${s.pts[0].u / s.w * 100}%;top:${s.pts[0].v / s.h * 100}%"></span>` : ''}</div></div>
    <div class="btnrow" style="margin-top:8px"><button class="btn sm" type="button" id="ovZoomIn" aria-label="Förstora bilden">+</button><button class="btn sm" type="button" id="ovZoomOut" aria-label="Förminska bilden">−</button><span class="small muted" style="align-self:center">Förstora för att träffa rätt.</span></div>
    <div class="actions"><button class="btn primary grow" type="button" id="ovNext" ${p.u == null ? 'disabled' : ''}>Nästa: samma plats i kartan</button><button class="btn ghost" type="button" id="ovCancel">Avbryt</button></div>`, m => {
    const inner = m.querySelector('#ovInner'), mark = m.querySelector('#ovMark'), wrap = m.querySelector('#ovWrap');
    const showMark = () => { if(p.u == null) return; mark.hidden = false; mark.style.left = (p.u / s.w * 100) + '%'; mark.style.top = (p.v / s.h * 100) + '%'; };
    const setZoom = z => {
      const cx = (wrap.scrollLeft + wrap.clientWidth / 2) / inner.clientWidth, cy = (wrap.scrollTop + wrap.clientHeight / 2) / inner.clientHeight;
      zoom = Math.max(1, Math.min(8, z)); inner.style.width = (zoom * 100) + '%';
      wrap.scrollLeft = cx * inner.clientWidth - wrap.clientWidth / 2; wrap.scrollTop = cy * inner.clientHeight - wrap.clientHeight / 2;
    };
    m.querySelector('#ovImg').addEventListener('click', e => {
      const r = e.currentTarget.getBoundingClientRect();
      p.u = (e.clientX - r.left) / r.width * s.w; p.v = (e.clientY - r.top) / r.height * s.h; showMark();
      m.querySelector('#ovNext').disabled = false;
    });
    m.querySelector('#ovZoomIn').addEventListener('click', () => setZoom(zoom * 2));
    m.querySelector('#ovZoomOut').addEventListener('click', () => setZoom(zoom / 2));
    m.querySelector('#ovCancel').addEventListener('click', () => { closeModal(); cancelCalibration(); });
    m.querySelector('#ovNext').addEventListener('click', () => { closeModal(); pickMap(i); });
    showMark();
  });
}
/* Steg 2: samma punkt i kartan, med kors och förstoringsglas. Den första punkten går att dra om den hamnade fel. */
let calCrossEl = null, calHandles = L.layerGroup().addTo(map);
function calCross(show){
  if(show && !calCrossEl){ calCrossEl = h(`<div class="crosshair" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="9"/><path d="M24 3v11M24 34v11M3 24h11M34 24h11"/></svg></div>`); map.getContainer().appendChild(calCrossEl); }
  if(calCrossEl) calCrossEl.hidden = !show;
}
function pickMap(i){
  const s = cal.shot, p = s.pts[i]; cal.step = 'map'; cal.i = i; map.closePopup();
  $('#btnAdd').hidden = true; if(!isDesktop()) setSheet('min');
  $('#ovbar').innerHTML = `<div class="shot-hint"><canvas id="ovCrop" width="120" height="80" aria-label="Utsnitt av bilden runt punkten"></canvas>
      <p>Flytta kartan så att <b>korset</b> hamnar på samma plats som i bilden (punkt ${i + 1} av 2). Förstoringsglaset visar vad som ligger under korset.</p></div>
    <div class="btnrow"><button class="btn primary" id="ovMapOk" type="button">${i ? 'Lägg bilden på kartan' : 'Nästa punkt'}</button><button class="btn" id="ovBack" type="button">Tillbaka till bilden</button><button class="btn ghost" id="ovMapCancel" type="button">Avbryt</button></div>`;
  $('#ovbar').hidden = false;
  const img = new Image(); img.onload = () => {
    const c = $('#ovCrop'); if(!c) return; const g = c.getContext('2d'), z = Math.max(s.w, s.h) / 8;
    g.fillStyle = '#ddd'; g.fillRect(0, 0, 120, 80);
    g.drawImage(img, p.u - z * .75, p.v - z / 2, z * 1.5, z, 0, 0, 120, 80);
    g.strokeStyle = '#d9520e'; g.lineWidth = 2; g.beginPath(); g.moveTo(60, 30); g.lineTo(60, 50); g.moveTo(50, 40); g.lineTo(70, 40); g.stroke();
  }; img.src = s.url;
  calCross(true); syncCross();
  if(p.ll){ map.setView(p.ll, Math.max(map.getZoom(), 15), {animate:false}); panToCross(p.ll); }
  setTimeout(() => { if(cal && cal.step === 'map' && cal.i === i){ syncCross(); if(p.ll) panToCross(p.ll); loupeAtCenter(); } }, 320);
  calMarks(); loupeAtCenter();
  $('#ovMapOk').addEventListener('click', () => {
    const c = crossLatLng(); p.ll = {lat:c.lat, lng:c.lng};
    if(i === 0){ pickImage(1); return; }
    const [A, B] = s.pts;
    if(Math.hypot(B.u - A.u, B.v - A.v) < Math.max(s.w, s.h) / 10){ toast('Punkterna i bilden ligger för nära varandra. Välj två platser längre ifrån varandra.', 5000); pickImage(1); return; }
    if(distM(A.ll, B.ll) < 30){ toast('Punkterna i kartan ligger för nära varandra.', 5000); return; }
    finishCalibration();
  });
  $('#ovBack').addEventListener('click', () => pickImage(i));
  $('#ovMapCancel').addEventListener('click', () => cancelCalibration());
}
function calMarks(){
  calHandles.clearLayers();
  if(!cal || cal.step !== 'map' || cal.i !== 1 || !cal.shot.pts[0].ll) return;
  const A = cal.shot.pts[0];
  loupeDrag(dragHandle(A.ll, 'shot first'), null, ll => { A.ll = {lat:ll.lat, lng:ll.lng}; }).addTo(calHandles);
}
map.on('move', () => { if(cal && cal.step === 'map') loupeAtCenter(); });
map.on('click', e => { if(cal && cal.step === 'map') panToCross(e.latlng, true); });
function endCalBar(keepCal){
  calCross(false); calHandles.clearLayers(); loupeHide();
  if(!adj){ $('#ovbar').hidden = true; $('#ovbar').innerHTML = ''; }
  if(!keepCal && !drawing && !placing) $('#btnAdd').hidden = false;
  if(!keepCal) setTimeout(sheetRestore, 0);
}
function finishCalibration(){
  const s = cal.shot, isNew = cal.isNew;
  endCalBar(true); cal.step = 'done';
  if(isNew){ shots.push(s); idbPut(s.id, s.blob); delete s.blob; }
  s.visible = true; showShot(s); refreshShot(s); saveShots(); renderShotList();
  const c = [[0, 0], [s.w, 0], [s.w, s.h], [0, s.h]].map(([u, v]) => shotImgToLatLng(s, u, v));
  map.fitBounds(L.latLngBounds(c), {paddingTopLeft:[20, 60], paddingBottomRight:[20, bottomPad() + 200]});
  const areaId = cal.areaId; cal = {shot:s, step:'done', areaId};
  $('#ovbar').innerHTML = `<p>Bilden ligger på kartan och finns kvar tills du tar bort den. Stämmer den inte, tryck Justera och dra punkterna rätt.</p>
    <div class="btnrow"><button class="btn primary" id="ovDrawBorder" type="button">Rita gräns</button><button class="btn" id="ovAdjust" type="button">Justera</button><button class="btn ghost" id="ovDone" type="button">Klar</button></div>
    <p class="small">Pass och torn lägger du ut med + som vanligt. Skärmdumparna tänder och släcker du i lagermenyn.</p>`;
  $('#ovbar').hidden = false; $('#btnAdd').hidden = true;
  $('#ovDrawBorder').addEventListener('click', () => openBorderPick(areaId));
  $('#ovAdjust').addEventListener('click', () => { const sh = cal.shot; cal = null; startAdjust(sh); });
  $('#ovDone').addEventListener('click', () => { cal = null; endCalBar(); });
}

/* --- Justera: dra de två punkterna (skala och vridning) eller mitten (flytta hela bilden) --- */
function startAdjust(s){
  endAdjust(); if(cal){ endCalBar(); cal = null; }
  if(!s.visible){ s.visible = true; saveShots(); renderShotList(); }
  showShot(s);
  adj = {shot:s, handles:L.layerGroup().addTo(map)};
  const mid = () => { const a = exactLayerPoint(map, s.pts[0].ll), b = exactLayerPoint(map, s.pts[1].ll); return map.unproject(a.add(b).divideBy(2).add(map.getPixelOrigin())); };
  const draw = () => {
    adj.handles.clearLayers();
    s.pts.forEach((p, i) => loupeDrag(dragHandle(p.ll, 'shot' + (i ? '' : ' first')), ll => { p.ll = {lat:ll.lat, lng:ll.lng}; refreshShot(s); }, () => { saveShots(); draw(); }).addTo(adj.handles));
    const c = dragHandle(mid(), 'shot move'); let start = null, from = null;
    c.on('dragstart', () => { start = exactLayerPoint(map, c.getLatLng()); from = s.pts.map(p => exactLayerPoint(map, p.ll)); });
    c.on('drag', () => { const d = exactLayerPoint(map, c.getLatLng()).subtract(start); s.pts.forEach((p, i) => { const ll = map.unproject(from[i].add(d).add(map.getPixelOrigin())); p.ll = {lat:ll.lat, lng:ll.lng}; }); refreshShot(s); });
    c.on('dragend', () => { saveShots(); draw(); });
    c.addTo(adj.handles);
  };
  draw();
  $('#btnAdd').hidden = true; if(!isDesktop()) setSheet('min');
  $('#ovbar').innerHTML = `<p>Dra en <b>punkt</b> för att passa in bilden: det skalar och vrider den. Dra <b>mitten</b> för att flytta hela bilden. Förstoringsglaset visas medan du drar.</p>
    <label class="trail-range" style="padding:0"><span style="display:flex;justify-content:space-between"><strong>Genomskinlighet</strong><span id="ovOpTxt">${Math.round(s.opacity * 100)} %</span></span><input type="range" id="ovOpacity" min="10" max="100" step="5" value="${Math.round(s.opacity * 100)}"></label>
    <div class="btnrow"><button class="btn primary" id="ovAdjDone" type="button">Klar</button><button class="btn" id="ovAdjRedo" type="button">Gör om punkterna</button></div>`;
  $('#ovbar').hidden = false;
  $('#ovOpacity').addEventListener('input', e => { s.opacity = e.target.value / 100; $('#ovOpTxt').textContent = e.target.value + ' %'; if(s.layer) s.layer.setOpacity(s.opacity); });
  $('#ovOpacity').addEventListener('change', saveShots);
  $('#ovAdjDone').addEventListener('click', () => { endAdjust(); toast('Bilden är sparad i sitt nya läge.'); });
  $('#ovAdjRedo').addEventListener('click', () => { endAdjust(); startCalibration(s, false); });
}
function endAdjust(){
  if(!adj) return;
  map.removeLayer(adj.handles); adj = null; saveShots(); loupeHide();
  $('#ovbar').hidden = true; $('#ovbar').innerHTML = '';
  if(!drawing && !placing && !cal) $('#btnAdd').hidden = false;
  sheetRestore();
}

loadShots();

/* ---------- Vind, kryss med avståndsringar och mätning ---------- */

/* Gemensamt: riktning och avstånd */
const DIR16 = ['N', 'NNO', 'NO', 'ONO', 'O', 'OSO', 'SO', 'SSO', 'S', 'SSV', 'SV', 'VSV', 'V', 'VNV', 'NV', 'NNV'];
const dirName = deg => DIR16[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];
function bearingDeg(a, b){
  const r = Math.PI / 180, f1 = a.lat * r, f2 = b.lat * r, dl = (b.lng - a.lng) * r;
  const y = Math.sin(dl) * Math.cos(f2), x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}
/* Punkt d meter från p i riktningen b grader (tillräckligt noggrant för några kilometer). */
function destPoint(p, d, b){
  const r = Math.PI / 180;
  return L.latLng(p.lat + d * Math.cos(b * r) / 111320, p.lng + d * Math.sin(b * r) / (111320 * Math.cos(p.lat * r)));
}
const metersPerPixel = (lat, z) => 40075016.686 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z + 8);
const blocked = () => placing || drawing || (typeof cal !== 'undefined' && cal) || (typeof adj !== 'undefined' && adj);

/* ---------- Vindriktning ----------
   Vinden hämtas från Open-Meteo (gratis, utan nyckel). Det gula området visar vart vittringen driver,
   från din position (eller korset om positionen inte är känd), och de blå pilarna rör sig med vinden. */
const WIND_LEN = 600;
map.createPane('wind'); map.getPane('wind').style.zIndex = 450; map.getPane('wind').style.pointerEvents = 'none';
const wind = {data:null, at:0, from:null, busy:false, layer:L.layerGroup().addTo(map), canvas:null, raf:0, sector:null, timer:null};
// Påslagen från början. Bara den som själv stängt av den (wind === false) har den avstängd.
const windOn = () => state.settings.wind !== false;
function windOrigin(){ return myPos ? L.latLng(myPos.lat, myPos.lng) : map.getCenter(); }
/* Hur brett området är: svag vind vänder mer, så då blir det bredare. */
const windHalf = s => s < 1.5 ? 45 : s < 4 ? 30 : 20;
async function windFetch(force){
  if(!windOn() || wind.busy) return;
  const o = windOrigin();
  if(!force && wind.data && Date.now() - wind.at < 10 * 60000 && wind.from && distM(wind.from, o) < 3000) return;
  wind.busy = true; windChip();
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${o.lat.toFixed(3)}&longitude=${o.lng.toFixed(3)}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=ms&timezone=auto`);
    if(!r.ok) throw new Error('http');
    const c = (await r.json()).current || {};
    if(typeof c.wind_direction_10m !== 'number' || typeof c.wind_speed_10m !== 'number') throw new Error('data');
    wind.data = {dir:c.wind_direction_10m, speed:c.wind_speed_10m, gust:typeof c.wind_gusts_10m === 'number' ? c.wind_gusts_10m : null, time:c.time || ''};
    wind.at = Date.now(); wind.from = o;
  } catch(e){ if(!wind.data) toast('Vinden kunde inte hämtas just nu.'); }
  wind.busy = false; windRender();
}
/* Det gula området: spets i origo, öppning mot det håll vinden blåser. */
function windSector(){
  const o = windOrigin(), d = wind.data; if(!d) return null;
  const axis = (d.dir + 180) % 360, half = windHalf(d.speed), pts = [o];
  for(let a = -half; a <= half + 1e-9; a += half / 8) pts.push(destPoint(o, WIND_LEN, axis + a));
  return {o, axis, half, pts};
}
function windRender(){
  wind.layer.clearLayers(); wind.sector = null;
  if(!windOn() || !wind.data){ windChip(); windAnim(false); renderWindNote(); return; }
  const s = wind.sector = windSector();
  L.polygon(s.pts, {color:'#e8b500', weight:2, opacity:.9, fillColor:'#ffd400', fillOpacity:.28, interactive:false, className:'wind-sector'}).addTo(wind.layer);
  windChip(); windAnim(true); renderWindNote();
}
function windChip(){
  const el = $('#windChip'); if(!el) return;
  el.hidden = !windOn();
  if(!windOn()) return;
  const d = wind.data;
  el.innerHTML = d ? `<svg viewBox="0 0 24 24" style="transform:rotate(${(d.dir + 180) % 360}deg)" aria-hidden="true"><path d="M12 3l5 9h-3.5v9h-3v-9H7z" fill="currentColor"/></svg><span><b>${dirName(d.dir)}</b> ${fmtNum(d.speed)} m/s${d.gust != null ? ` <span class="muted">byar ${fmtNum(d.gust)}</span>` : ''}</span>`
    : `<span>${wind.busy ? 'Hämtar vind …' : 'Ingen vinddata'}</span>`;
  el.title = d ? `Vind från ${dirName(d.dir)} (${Math.round(d.dir)}°). Tryck för att hämta igen.` : '';
}
const fmtNum = v => (Math.round(v * 10) / 10).toLocaleString('sv-SE');
function renderWindNote(){
  const n = $('#windNote'); if(!n) return;
  const d = wind.data;
  n.textContent = !windOn() ? 'Gult område där vittringen driver, med pilar som visar vinden' : d ? `Vind från ${dirName(d.dir)}, ${fmtNum(d.speed)} m/s. Från ${myPos ? 'din position' : 'korset'}. Open-Meteo.` : 'Hämtar …';
  const c = $('#popWind'); if(c) c.checked = windOn();
}
function setWind(on){
  state.settings.wind = !!on; save();
  if(on){ windFetch(); clearInterval(wind.timer); wind.timer = setInterval(() => windFetch(), 10 * 60000); }
  else { clearInterval(wind.timer); }
  windRender();
}
/* Blå pilar som rör sig i vindens riktning inne i det gula området, ritade på en canvas som följer kartan. */
function windAnim(on){
  if(!on){ cancelAnimationFrame(wind.raf); wind.raf = 0; if(wind.canvas) wind.canvas.hidden = true; return; }
  if(!wind.canvas){ wind.canvas = L.DomUtil.create('canvas', 'wind-arrows', map.getPane('wind')); }
  wind.canvas.hidden = false;
  if(!wind.raf) wind.raf = requestAnimationFrame(windFrame);
}
function windFrame(t){
  wind.raf = 0;
  const s = wind.sector, cv = wind.canvas; if(!s || !cv || cv.hidden) return;
  if(!document.hidden){
    const size = map.getSize(), dpr = window.devicePixelRatio || 1;
    if(cv.width !== Math.round(size.x * dpr) || cv.height !== Math.round(size.y * dpr)){ cv.width = Math.round(size.x * dpr); cv.height = Math.round(size.y * dpr); cv.style.width = size.x + 'px'; cv.style.height = size.y + 'px'; }
    L.DomUtil.setPosition(cv, map.containerPointToLayerPoint([0, 0]));
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, size.x, size.y);
    const P = s.pts.map(ll => map.latLngToContainerPoint(ll)), A = P[0];
    g.save(); g.beginPath(); P.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.closePath(); g.clip();
    const r = Math.PI / 180, ax = Math.sin(s.axis * r), ay = -Math.cos(s.axis * r), px = -ay, py = ax;   // axel (nedvind) och tvärs
    const R = Math.max(...P.map(p => Math.hypot(p.x - A.x, p.y - A.y)));
    const step = 30, len = 11, speed = 14 + wind.data.speed * 5;                 // pixlar mellan pilarna, pilens längd, fart (px/s)
    const phase = ((t / 1000) * speed) % step;
    // Bara den del av rutnätet som syns på skärmen
    const cs = [[0, 0], [size.x, 0], [size.x, size.y], [0, size.y]].map(([x, y]) => [(x - A.x) * ax + (y - A.y) * ay, (x - A.x) * px + (y - A.y) * py]);
    const u0 = Math.max(-step, Math.min(...cs.map(c => c[0]))), u1 = Math.min(R, Math.max(...cs.map(c => c[0])));
    const v0 = Math.max(-R, Math.min(...cs.map(c => c[1]))), v1 = Math.min(R, Math.max(...cs.map(c => c[1])));
    g.strokeStyle = '#1a73e8'; g.fillStyle = '#1a73e8'; g.lineWidth = 2; g.lineCap = 'round';
    let n = 0;
    for(let u = Math.floor(u0 / step) * step; u <= u1 && n < 4000; u += step){
      const row = Math.round(u / step), off = (row & 1) ? step / 2 : 0;
      for(let v = Math.floor(v0 / step) * step; v <= v1 && n < 4000; v += step){
        const uu = u + phase, vv = v + off, x = A.x + ax * uu + px * vv, y = A.y + ay * uu + py * vv;
        const hx = x + ax * len / 2, hy = y + ay * len / 2;
        g.beginPath(); g.moveTo(x - ax * len / 2, y - ay * len / 2); g.lineTo(hx, hy); g.stroke();
        g.beginPath(); g.moveTo(hx + ax * 3, hy + ay * 3); g.lineTo(hx - ax * 3 + px * 3.5, hy - ay * 3 + py * 3.5); g.lineTo(hx - ax * 3 - px * 3.5, hy - ay * 3 - py * 3.5); g.closePath(); g.fill();
        n++;
      }
    }
    g.restore();
    wind.frames = (wind.frames || 0) + 1;
  }
  wind.raf = requestAnimationFrame(windFrame);
}
map.on('move zoom', () => { if(windOn() && wind.data && !myPos) windRender(); });
map.on('moveend', () => { if(windOn()) windFetch(); });
$('#popWind').addEventListener('change', e => setWind(e.target.checked));
$('#windChip').addEventListener('click', () => { windFetch(true); toast('Hämtar vinden igen …', 1500); });

/* ---------- Kryss med avståndsringar ----------
   Visas i mitten av den synliga kartan medan man panorerar och zoomar, och en stund efteråt.
   Visar också avståndet från din position till krysset. Ligger kvar hela tiden när man mäter. */
const NICE = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000, 50000];
const pan = {el:null, timer:null, ready:false};
function panInit(){
  if(pan.el) return;
  pan.el = h(`<div class="pancross" hidden aria-hidden="true"><div class="pc-rings"></div><svg class="pc-x" viewBox="0 0 30 30"><path d="M15 3v9M15 18v9M3 15h9M18 15h9" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M15 3v9M15 18v9M3 15h9M18 15h9" stroke="#16231c" stroke-width="2" stroke-linecap="round"/></svg><div class="pc-label"></div></div>`);
  map.getContainer().appendChild(pan.el);
}
function panShow(stay){
  if(!pan.ready) return;
  if(blocked() && !measure) { panHide(); return; }
  panInit(); pan.el.hidden = false; panUpdate();
  clearTimeout(pan.timer);
  if(!stay && !measure) pan.timer = setTimeout(panHide, 2500);
}
function panHide(){ clearTimeout(pan.timer); if(pan.el && !measure) pan.el.hidden = true; }
function panUpdate(){
  if(!pan.el || pan.el.hidden) return;
  // Mitt på skärmen. I mätläget ovanför mätfältet, där punkterna sätts.
  const p = measure ? crossPoint() : map.getSize().divideBy(2).round(), ll = map.containerPointToLatLng(p), mpp = metersPerPixel(ll.lat, map.getZoom());
  pan.el.style.left = p.x + 'px'; pan.el.style.top = p.y + 'px';
  const step = NICE.find(m => m / mpp >= 38) || NICE[NICE.length - 1];
  pan.el.querySelector('.pc-rings').innerHTML = [1, 2, 3].map(k => { const rpx = k * step / mpp; return `<span class="pc-ring" style="width:${2 * rpx}px;height:${2 * rpx}px;margin:${-rpx}px 0 0 ${-rpx}px"></span><span class="pc-rl" style="top:${-rpx}px">${fmtDist(k * step)}</span>`; }).join('');
  const lab = pan.el.querySelector('.pc-label');
  lab.textContent = myPos ? `${fmtDist(distM(myPos, ll))} från dig · ${dirName(bearingDeg(L.latLng(myPos.lat, myPos.lng), ll))}` : '';
  lab.hidden = !myPos;
}
map.on('movestart zoomstart', () => panShow(true));
map.on('move zoom', () => { if(pan.el && !pan.el.hidden) panUpdate(); else panShow(true); });
map.on('moveend zoomend', () => { if(pan.el && !pan.el.hidden){ panUpdate(); if(!measure){ clearTimeout(pan.timer); pan.timer = setTimeout(panHide, 2500); } } });

/* ---------- Mäta avstånd ----------
   Flytta kartan så att krysset hamnar på en punkt och tryck Sätt punkt. Linjen och avståndet följer krysset
   till nästa punkt. Man kan sätta flera punkter, då visas hela sträckan. */
let measure = null;   // {pts:[latlng], layer}
function startMeasure(){
  if(drawing || placing || (typeof cal !== 'undefined' && cal) || (typeof adj !== 'undefined' && adj)) return;
  measure = {pts:[], layer:L.layerGroup().addTo(map)};
  $('#btnMeasure').setAttribute('aria-pressed', 'true');
  $('#measurebar').hidden = false; $('#btnAdd').hidden = true; if(!isDesktop()) setSheet('min');
  panShow(true); measureRender();
  setTimeout(() => { syncCross(); panUpdate(); measureRender(); }, 320);
}
function endMeasure(){
  if(!measure) return;
  map.removeLayer(measure.layer); measure = null;
  $('#btnMeasure').setAttribute('aria-pressed', 'false');
  $('#measurebar').hidden = true; $('#btnAdd').hidden = false; panHide(); sheetRestore();
}
const pathLen = pts => pts.reduce((s, p, i) => i ? s + distM(pts[i - 1], p) : 0, 0);
function measureRender(){
  if(!measure) return;
  measure.layer.clearLayers();
  const c = crossLatLng(), P = measure.pts;
  if(P.length){
    L.polyline(P.concat([c]), {color:'#ffffff', weight:6, opacity:.8, interactive:false}).addTo(measure.layer);
    L.polyline(P, {color:'#d9520e', weight:3, interactive:false}).addTo(measure.layer);
    L.polyline([P[P.length - 1], c], {color:'#d9520e', weight:3, dashArray:'6 6', interactive:false}).addTo(measure.layer);
    P.forEach(p => L.circleMarker(p, {radius:5, color:'#fff', weight:2, fillColor:'#d9520e', fillOpacity:1, interactive:false}).addTo(measure.layer));
  }
  const last = P[P.length - 1], seg = last ? distM(last, c) : 0, tot = pathLen(P);
  $('#measureText').innerHTML = !P.length ? 'Flytta kartan så att krysset hamnar på den första punkten och tryck <b>Sätt punkt</b>.'
    : `<b>${fmtDist(tot + seg)}</b> till krysset${P.length > 1 ? ` <span class="muted">(${fmtDist(tot)} mellan punkterna)</span>` : ''}<br><span class="small muted">Senaste delen ${fmtDist(seg)} mot ${dirName(bearingDeg(last, c))}${P.length > 1 ? ` · ${P.length} punkter` : ''}</span>`;
  $('#mUndo').disabled = !P.length;
}
map.on('move zoom', () => { if(measure) measureRender(); });
map.on('click', e => { if(measure) panToCross(e.latlng, true); });
$('#btnMeasure').addEventListener('click', () => { if(measure) endMeasure(); else startMeasure(); });
$('#mAdd').addEventListener('click', () => { const c = crossLatLng(); measure.pts.push(L.latLng(c.lat, c.lng)); measureRender(); });
$('#mUndo').addEventListener('click', () => { measure.pts.pop(); measureRender(); });
$('#mClose').addEventListener('click', endMeasure);

/* Starta när kartan har fått sitt första läge */
map.whenReady(() => setTimeout(() => { pan.ready = true; if(windOn()) setWind(true); }, 400));

/* ---------- Riktningen jag tittar åt ----------
   En blå kon från positionspricken, efter telefonens kompass. Startas av ett tryck på positionsknappen
   (på iPhone krävs ett tryck för att få tillåtelse att läsa kompassen). */
const compass = {on:false, heading:null, raf:0};
const screenAngle = () => (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (typeof window.orientation === 'number' ? window.orientation : 0);
function onOrient(e){
  let hd = null;
  if(typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) hd = e.webkitCompassHeading;   // iPhone: medsols från norr
  else if(e.absolute && typeof e.alpha === 'number') hd = 360 - e.alpha;                                            // Android: moturs från norr
  if(hd == null) return;
  compass.heading = ((hd + screenAngle()) % 360 + 360) % 360;
  if(!compass.raf) compass.raf = requestAnimationFrame(() => { compass.raf = 0; renderHeading(); });
}
function renderHeading(){
  const el = typeof meMarker !== 'undefined' && meMarker && meMarker.getElement(), cone = el && el.querySelector('.me-cone');
  if(!cone) return;
  // SVG-element har ingen hidden-egenskap, så attributet sätts direkt
  if(compass.heading == null){ cone.setAttribute('hidden', ''); return; }
  cone.removeAttribute('hidden'); cone.style.transform = `rotate(${compass.heading}deg)`;
}
function startCompass(){
  if(compass.on) return;
  const go = () => {
    compass.on = true;
    window.addEventListener('deviceorientationabsolute', onOrient);
    window.addEventListener('deviceorientation', e => { if(typeof e.webkitCompassHeading === 'number' || e.absolute) onOrient(e); });
  };
  try {
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission().then(r => { if(r === 'granted') go(); }).catch(() => {});
    else go();
  } catch(e){}
}
$('#btnLocate').addEventListener('click', startCompass);
$('#popTrailRec').addEventListener('change', startCompass);
$('#paneJakt').addEventListener('change', e => { if(e.target.id === 'shareToggle') startCompass(); });
$('#btnObs').addEventListener('click', () => { if(!blocked() && !measure) startPlacing({mode:'obs'}); });


/* ---------- Start ---------- */
map.on('moveend', () => { const c = map.getCenter(); state.settings.view = {lat:+c.lat.toFixed(5), lng:+c.lng.toFixed(5), z:map.getZoom()}; save(); });
const v = state.settings.view;
if(v && isFinite(v.lat)) map.setView([v.lat, v.lng], v.z || 12);
else map.setView([62.5, 16.5], 5);
setBase(state.settings.base);
setSheet('peek', true);
readHash();
renderAll(); roadsUpdate(); renderGbif(); renderDensity();
if(cloud.pending) setTab('jakt');
cloudInit();
if(!v && state.pins.length) setTimeout(fitAll, 50);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => setSheet(sheet, true));
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { setSheet(sheet, true); map.invalidateSize(); }, 120); });

/* Testkrok */
window.__fk = {zoomToArea, startCompass, compass, renderObs, wind, pan, measure:() => measure, distM, bearingDeg, crossLatLng, crossPoint, panToCross, setSheet, sheet:() => sheet, renderAll, drawingPts:() => drawing && drawing.pts, shots:() => shots, shotImgToLatLng, loupe, trail, showMe, personColor, areaHa, parseBorder, parseRing, startDrawing, openAreaForm, roads, cloud, VILT, viltLawful, viltRows, parseCfg, state:() => state, toSweref99TM, parseKML, parseGPX, parseCSV, parseGeoJSON, map, gbif, setSvampMode, loadGbifInView, fitAll, startPlacing, openPinForm};
})();
</script>
